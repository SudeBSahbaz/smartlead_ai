<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENCORE | Kültür Asistanı</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f1020;
            color: #ffffff;
        }
        main {
            width: min(760px, calc(100% - 32px));
            margin: 60px auto;
        }
        .card {
            background: #181a2e;
            border: 1px solid #2b2e4d;
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 24px;
        }
        h1 { margin-top: 0; }
        input, textarea, button {
            width: 100%;
            margin-top: 10px;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid #3b3f65;
            font: inherit;
        }
        input, textarea {
            background: #101225;
            color: white;
        }
        button {
            border: 0;
            background: #7257ff;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }
        .response {
            white-space: pre-wrap;
            margin-top: 16px;
            line-height: 1.6;
        }
        a { color: #b5a8ff; }
    </style>
</head>
<body>
<main>
    <div class="card">
        <h1>ENCORE</h1>
        <p>Yapay zekâ destekli kültür-sanat asistanı.</p>

        <textarea id="mesaj" rows="5" placeholder="ENCORE'a bir şey sor..."></textarea>
        <button id="sorBtn">Sor</button>
        <div id="yanit" class="response"></div>
    </div>

    <div class="card">
        <h2>İletişim Bırak</h2>
        <input id="isim" placeholder="Ad Soyad">
        <input id="telefon" placeholder="Telefon">
        <button id="kaydetBtn">Kaydet</button>
        <div id="leadSonuc" class="response"></div>
    </div>

    <p><a href="/dashboard">Yönetim Paneli</a></p>
</main>

<script>
    const mesaj = document.getElementById("mesaj");
    const yanit = document.getElementById("yanit");

    document.getElementById("sorBtn").addEventListener("click", async () => {
        yanit.textContent = "Yanıt hazırlanıyor...";

        const response = await fetch("/api/sohbet", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                mesaj: mesaj.value,
                gecmis: []
            })
        });

        const data = await response.json();
        yanit.textContent = data.basari ? data.yanit : data.hata;
    });

    document.getElementById("kaydetBtn").addEventListener("click", async () => {
        const response = await fetch("/api/leads", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                isim: document.getElementById("isim").value,
                telefon: document.getElementById("telefon").value,
                mesaj: mesaj.value
            })
        });

        const data = await response.json();
        document.getElementById("leadSonuc").textContent =
            data.basari ? data.mesaj : data.hata;
    });
</script>
</body>
</html>
